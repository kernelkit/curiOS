name: CVE Watch

on:
  schedule:
    # NVD moves daily, the images do not.  Report drift every morning.
    - cron: '17 5 * * *'
  push:
    tags:
      - 'v[0-9]*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [system, httpd, ntpd, nftables, neofetch]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install pkg-stats dependencies
        run: pip install aiohttp setuptools
      - name: Restore Cache of NVD feed
        uses: actions/cache@v5
        with:
          path: dl/buildroot-nvd
          # The feed is a git clone that pkg-stats updates in place, so
          # any recent copy is a good starting point.
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - name: Configure
        run: make ${{ matrix.app }}_amd64_defconfig
      - name: Scan
        run: make VERSION="${{ github.ref_name }}" cve | tee -a $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: cve-report-${{ matrix.app }}
          path: |
            output/pkg-stats.json
            output/pkg-stats.html
            output/show-info.json
